plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (the GitHub workflow sets it from secrets).
// Without it the release build is signed with the debug key, so the APK can still be installed.
def releaseKeystore = System.getenv('MUX_KEYSTORE_FILE')

android {
    namespace 'io.github.crazyfull.muxtunnel'
    compileSdk 34
    ndkVersion '27.2.12479018'      // keep in sync with .github/workflows/android-build.yml

    defaultConfig {
        applicationId 'io.github.crazyfull.muxtunnel'
        minSdk 21                   // Android 5.0
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('MUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MUX_KEY_ALIAS')
                keyPassword System.getenv('MUX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One APK per CPU architecture plus a universal one that contains all of them.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    sourceSets {
        main {
            // hev.htproxy.TProxyService: the JNI binding shipped with hev-socks5-tunnel
            java.srcDirs += ['../../../third_party/hev-socks5-tunnel/android']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
