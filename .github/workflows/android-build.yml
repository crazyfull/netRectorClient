name: Android APK

# Manual build of the Android app (example/android-mux-tunnel) for every Android ABI:
# armeabi-v7a, arm64-v8a, x86, x86_64, plus a universal APK that contains all of them.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - debug
        default: release
      publish_release:
        description: "Also attach the APKs to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (only used when publishing)"
        type: string
        default: "android-latest"

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"   # keep in sync with ndkVersion in app/build.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/android-mux-tunnel
    steps:
      - name: Checkout (with the hev-socks5-tunnel submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare the signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Without the secrets the release APK is signed with the debug key (still installable).
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MUX_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "MUX_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MUX_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MUX_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          chmod +x ./gradlew
          ./gradlew --no-daemon "$TASK"

      - name: Collect the APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/apk/" \;
          ls -l "$GITHUB_WORKSPACE/apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: mux-tunnel-${{ inputs.build_type }}-apks
          path: apk/*.apk
          if-no-files-found: error

      - name: Publish a release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Mux Tunnel (Android) ${{ inputs.release_tag }}
          files: apk/*.apk
