name: iOS IPA (TrollStore)

# Manual build of the iOS app (example/ios-mux-tunnel). The result is ONE file, not zipped:
#   MuxTunnel-trollstore.ipa   entitlements fake-signed in: open it with TrollStore (no Apple Developer account).
# A build for a real signing identity (TestFlight, App Store) needs your own provisioning profiles
# with the "Network Extensions" capability for both bundle ids; see docs/ios-network-extension-guide.md.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the IPA to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (only used when publishing)"
        type: string
        default: "ios-latest"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example/ios-mux-tunnel
    steps:
      - name: Checkout (with the hev-socks5-tunnel submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Library tests (the macOS runner has an IPv6 loopback, the Linux sandbox has not)
        working-directory: .
        run: |
          cmake -S . -B build-tests -DNETRECTOR_ENABLE_TLS=OFF -DNETRECTOR_BUILD_EXAMPLES=OFF -DNETRECTOR_BUILD_TESTS=ON
          cmake --build build-tests -j 4
          ./build-tests/tests/netRectorClientTests tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache BoringSSL (TLS, built for every iOS slice)
        uses: actions/cache@v4
        with:
          path: example/ios-mux-tunnel/build/boringssl
          key: boringssl-ios-${{ hashFiles('scripts/fetch-boringssl.sh', 'example/ios-mux-tunnel/scripts/buildBoringSSL.sh') }}

      - name: Build the native core (xcframework)
        run: ./scripts/buildNativeCore.sh

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          xcodebuild \
            -project MuxTunnel.xcodeproj \
            -scheme MuxTunnel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the TrollStore IPA
        run: |
          # TrollStore installs apps with any entitlements and needs no Apple Developer account, but
          # the entitlements must be inside the binaries: add them with a fake signature (ldid).
          brew install ldid
          rm -rf build/trollstore && mkdir -p build/trollstore/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/MuxTunnel.app build/trollstore/Payload/
          APP=build/trollstore/Payload/MuxTunnel.app
          ldid -SExtension/MuxTunnelExtension.entitlements "$APP/PlugIns/MuxTunnelExtension.appex/MuxTunnelExtension"
          ldid -SApp/MuxTunnel.entitlements "$APP/MuxTunnel"
          echo "--- app entitlements";       ldid -e "$APP/MuxTunnel"
          echo "--- extension entitlements"; ldid -e "$APP/PlugIns/MuxTunnelExtension.appex/MuxTunnelExtension"
          (cd build/trollstore && zip -qry "$GITHUB_WORKSPACE/MuxTunnel-trollstore.ipa" Payload)
          ls -l "$GITHUB_WORKSPACE/MuxTunnel-trollstore.ipa"

      - name: Upload the IPA (not zipped)
        uses: actions/upload-artifact@v7
        with:
          name: MuxTunnel-trollstore.ipa
          path: MuxTunnel-trollstore.ipa
          archive: false
          if-no-files-found: error

      - name: Publish a release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Mux Tunnel (iOS, TrollStore) ${{ inputs.release_tag }}
          files: MuxTunnel-trollstore.ipa
